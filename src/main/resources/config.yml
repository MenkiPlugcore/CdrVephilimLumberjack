settings:
  required-tool: DIAMOND_AXE
  hits-required: 3
  hit-delay-ms: 650
  progress-reset-ms: 5000
  node-cooldown-seconds: 30
  durability-per-hit: 1
  reward-amount: 1

chop-range:
  enabled: true
  # Jarak maksimum player dari batang terdekat dalam satu node pohon.
  # Set 0 atau enabled: false untuk menonaktifkan batas jarak.
  max-distance: 3.5

visual:
  enabled: true
  harvested-fallback-log-material: STRIPPED_OAK_LOG
  harvested-leaf-material: BROWN_STAINED_GLASS
  scan-radius: 7
  leaf-radius: 2
  max-blocks: 160

resource:
  material: OAK_LOG
  name: '&6Vephilim Timber'
  lore:
    - '&7Timber gathered from a Vephilim logging node.'
    - '&8Trade Resource'

npc-sell:
  enabled: true
  interaction-cooldown-ms: 750
  # Masukkan Citizens NPC ID di bawah ini.
  # Setiap NPC dapat memiliki harga Vephilim Timber yang berbeda.
  # Contoh:
  # npcs:
  #   '12':
  #     price-per-timber: 250.0
  #   '27':
  #     price-per-timber: 300.0
  npcs: {}

messages:
  prefix: '&8[&6Vephilim Lumber&8] &r'
  wrong-tool: '&cGunakan Diamond Axe untuk menebang pohon ini.'
  hit-leaves: '&eTebang bagian batang pohon.'
  too-far: '&cTerlalu jauh dari pohon. &7Maks. &f{distance} blok'
  cooldown: '&7Pohon ini sedang tumbuh kembali. &f{seconds}s'
  progress: '&6Menebang... &f{bar} &7({hit}/{max})'
  harvested: '&a+{amount} Vephilim Timber'
  npc-no-timber: '&eKamu tidak memiliki Vephilim Timber untuk dijual.'
  npc-sold: '&aTerjual &f{amount} Timber &7| &a+{money}'
  npc-sale-failed: '&cPenjualan gagal. Timber kamu sudah dikembalikan.'
  npc-invalid-price: '&cNPC pembeli Timber ini belum memiliki harga yang valid.'
